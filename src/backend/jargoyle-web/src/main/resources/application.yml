spring:
  application:
    name: jargoyle

  # --- Database ---
  # Database configuration is profile-driven. The "dev" profile
  # (application-dev.yml) provides the datasource, JPA, and Flyway settings
  # for local development with the PostgreSQL container in compose.yml.
  #
  # For production, set these environment variables instead:
  #   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
  #
  # In the default (no-profile) case, DataSource and Hibernate auto-configuration
  # is disabled so the application starts without a database connection.

  # --- Security ---
  # Where to redirect after a successful OAuth login.
  # The dev profile overrides this to the Vite dev server URL.
  oauth-success-url: /

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5.4-mini
      embedding:
        options:
          model: text-embedding-3-small

jargoyle:
  async:
    document-processing:
      core-pool-size: 2
      max-pool-size: 5
      queue-capacity: 25
      thread-name-prefix: doc-processing
  rag:
    chunk:
      target-tokens: 500
      overlap-tokens: 50
      min-tokens: 100
    retrieval:
      max-context-tokens: 100000
      max-chunks: 200
    chat:
      max-history-messages: 10
      max-history-tokens: 8000
      max-response-tokens: 4000
