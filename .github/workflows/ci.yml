name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        working-directory: src/backend
        run: ./gradlew test

      - name: Test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: src/backend/**/build/test-results/test/*.xml
          check_name: Backend Test Report

  frontend-test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Run tests
        working-directory: src/frontend
        run: npm test

      - name: Test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: src/frontend/test-results/junit.xml
          check_name: Frontend Test Report
