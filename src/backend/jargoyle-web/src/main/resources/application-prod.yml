# Production profile configuration.
# Active when SPRING_PROFILES_ACTIVE includes "prod".
# Applied on top of application.yml — overrides and extends the base config.

spring:

  # Cancel the autoconfigure exclusions from application.yml.
  # DataSource, Hibernate, and Flyway auto-configuration is needed in production.
  autoconfigure:
    exclude: []

  datasource:
    # Railway injects these environment variables for provisioned PostgreSQL instances.
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Hibernate checks the schema matches the entities but does not modify it.
      # Flyway is responsible for all schema changes.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    enabled: false

jargoyle:
  storage:
    s3:
      bucket-name: ${JARGOYLE_S3_BUCKET_NAME}
      region: ${JARGOYLE_S3_REGION:us-west-2}
      upload-url-ttl: ${JARGOYLE_S3_UPLOAD_URL_TTL:15m}

logging:
  level:
    com.jargoyle: INFO
    org.springframework: WARN
