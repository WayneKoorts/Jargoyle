name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        working-directory: src/backend
        run: ./gradlew test

      - name: Test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: src/backend/**/build/test-results/test/*.xml
